name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      CODEX_RPC_WEBSITE: ${{ secrets.CODEX_RPC_WEBSITE || vars.CODEX_RPC_WEBSITE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/client/go.mod
          cache-dependency-path: apps/client/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wails CLI and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisDirectories = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS"
          )
          $nsisDirectory = $nsisDirectories | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'makensis.exe') } | Select-Object -First 1
          if (-not $nsisDirectory) { throw 'NSIS installation did not provide makensis.exe.' }
          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Validate bundled installation settings
        shell: pwsh
        run: |
          if ($env:DISCORD_CLIENT_ID -notmatch '^\d{17,22}$') { throw 'Set the DISCORD_CLIENT_ID repository secret.' }
          if ($env:CODEX_RPC_WEBSITE -notmatch '^https://[^/?#]+/?$') { throw 'Set the CODEX_RPC_WEBSITE repository secret or variable to the HTTPS website origin (https://your-domain.com).' }
      - name: Build Windows installer
        working-directory: apps/client
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          wails3 task package GOOS=windows ARCH=amd64 VERSION=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item bin/codex-rpc.exe bin/codex-rpc-updater-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/client/bin/codex-rpc-windows-amd64-installer.exe
            apps/client/bin/codex-rpc-updater-windows-amd64.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    env:
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      CODEX_RPC_WEBSITE: ${{ secrets.CODEX_RPC_WEBSITE || vars.CODEX_RPC_WEBSITE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/client/go.mod
          cache-dependency-path: apps/client/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
      - name: Validate bundled installation settings
        run: |
          [[ "$DISCORD_CLIENT_ID" =~ ^[0-9]{17,22}$ ]] || { echo "Set the DISCORD_CLIENT_ID repository secret." >&2; exit 1; }
          [[ "$CODEX_RPC_WEBSITE" =~ ^https://[^/?#]+/?$ ]] || { echo "Set the CODEX_RPC_WEBSITE repository secret or variable to the HTTPS website origin (https://your-domain.com)." >&2; exit 1; }
      - name: Build universal macOS disk image
        working-directory: apps/client
        run: |
          VERSION="${GITHUB_REF_NAME#v}" wails3 task package GOOS=darwin
          ditto -c -k --sequesterRsrc --keepParent bin/codex-rpc.app bin/codex-rpc-updater-darwin-universal.zip
          cp bin/codex-rpc-updater-darwin-universal.zip bin/codex-rpc-updater-darwin-amd64.zip
          cp bin/codex-rpc-updater-darwin-universal.zip bin/codex-rpc-updater-darwin-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/client/bin/codex-rpc-macos-universal.dmg
            apps/client/bin/codex-rpc-updater-darwin-amd64.zip
            apps/client/bin/codex-rpc-updater-darwin-arm64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    env:
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      CODEX_RPC_WEBSITE: ${{ secrets.CODEX_RPC_WEBSITE || vars.CODEX_RPC_WEBSITE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/client/go.mod
          cache-dependency-path: apps/client/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
      - name: Validate bundled installation settings
        run: |
          [[ "$DISCORD_CLIENT_ID" =~ ^[0-9]{17,22}$ ]] || { echo "Set the DISCORD_CLIENT_ID repository secret." >&2; exit 1; }
          [[ "$CODEX_RPC_WEBSITE" =~ ^https://[^/?#]+/?$ ]] || { echo "Set the CODEX_RPC_WEBSITE repository secret or variable to the HTTPS website origin (https://your-domain.com)." >&2; exit 1; }
      - name: Build Linux packages
        working-directory: apps/client
        run: |
          sh -n scripts/install.sh
          VERSION="${GITHUB_REF_NAME#v}" wails3 task package GOOS=linux ARCH=amd64
          cp bin/codex-rpc-linux-amd64.AppImage bin/codex-rpc-updater-linux-amd64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/client/bin/codex-rpc-linux-amd64.AppImage
            apps/client/bin/codex-rpc-updater-linux-amd64.AppImage
            apps/client/bin/*.deb
            apps/client/bin/*.rpm
            apps/client/bin/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/client/go.mod
          cache-dependency-path: apps/client/go.sum
      - name: Install Wails release tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails release tools
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
      - name: Create signed update manifest
        env:
          WAILS_UPDATER_PRIVATE_KEY: ${{ secrets.WAILS_UPDATER_PRIVATE_KEY }}
        run: |
          if [[ -z "$WAILS_UPDATER_PRIVATE_KEY" ]]; then
            echo "Set the WAILS_UPDATER_PRIVATE_KEY repository secret before publishing releases." >&2
            exit 1
          fi
          printf '%s' "$WAILS_UPDATER_PRIVATE_KEY" > "$RUNNER_TEMP/updater.key"
          version="${GITHUB_REF_NAME#v}"
          wails3 updater manifest \
            -version "$version" \
            -key "$RUNNER_TEMP/updater.key" \
            -url-prefix "https://github.com/ge0rg3e/codex-rpc/releases/download/${GITHUB_REF_NAME}/" \
            -output dist/manifest.json \
            dist/codex-rpc-updater-*
          rm -f "$RUNNER_TEMP/updater.key"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
